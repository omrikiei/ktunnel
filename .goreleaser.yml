# Documentation: https://goreleaser.com
version: 2

project_name: ktunnel

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - id: ktunnel
    env:
      - CGO_ENABLED=0
    # The version is stamped in from the git tag rather than read from a
    # constant, so the binary, the release tag and the default --server-image
    # tag can never drift apart.
    ldflags:
      - "-s -w -X github.com/omrikiei/ktunnel/cmd.version={{ trimprefix .Version \"v\" }}"
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # The name template is load-bearing: .krew.yaml and ktunnel.rb both build
  # download URLs from it. Do not change it without updating both.
  - id: default
    ids:
      - ktunnel
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: false
  prerelease: auto
  name_template: "ktunnel {{ .Tag }}"
  header: |
    ## ktunnel {{ .Tag }}

    Curated notes for this release are in
    [CHANGELOG.md](https://github.com/omrikiei/ktunnel/blob/{{ .Tag }}/CHANGELOG.md).

    ### Install

    ```sh
    brew install omrikiei/ktunnel/ktunnel
    kubectl krew install tunnel
    ```

    Container image:
    `docker.io/omrieival/ktunnel:{{ .Tag }}`, mirrored at
    `ghcr.io/omrikiei/ktunnel:{{ .Tag }}`.
  footer: |
    ---

    Upgrading from v1.6.1? Read the **Breaking changes** and **Known
    issues** sections of the changelog first.

nfpms:
  - id: ktunnel
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - ktunnel
    homepage: https://github.com/omrikiei/ktunnel
    maintainer: omrikiei <omrieival@gmail.com>
    description: Ktunnel is a network tunneling tool for kubernetes
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    epoch: 1

brews:
  - repository:
      owner: omrikiei
      name: homebrew-ktunnel
      # Publishing to the tap needs a PAT with write access to
      # omrikiei/homebrew-ktunnel; the workflow's default GITHUB_TOKEN is
      # scoped to this repo only. Without the secret the formula is still
      # built into dist/ and the release itself succeeds.
      token: "{{ if index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\" }}{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}{{ end }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: omrikiei
      email: omrieival@gmail.com
    homepage: "https://github.com/omrikiei/ktunnel"
    description: "Network tunneling tool for kubernetes."
    license: "GPL-3.0"
    test: |
      system "#{bin}/ktunnel", "version"
