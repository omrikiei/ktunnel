name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run security scan
        run: gosec -exclude-dir=.git -exclude-dir=vendor ./...

  windows:
    name: Run Tests (Windows)
    runs-on: windows-latest

    # Every release publishes a Windows binary, and until now nothing in CI
    # ever ran a line of this code on Windows -- the whole test job is
    # ubuntu-latest. #121 is a Windows user reporting that ktunnel stopped
    # working, and the honest answer to "does it work on Windows?" was that
    # nobody knew: the code cross-compiles, which is all `goreleaser` proves.
    #
    # This job is deliberately just the build and the tests. The formatting,
    # coverage and gosec steps above analyse source rather than behaviour, so
    # they say the same thing on every platform and running them twice would
    # only buy a second way for the shell to differ.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      # -race, like the Linux job: the parts of ktunnel most likely to behave
      # differently here -- port forwards being released, sessions being torn
      # down on Ctrl+C -- are all goroutines and channels, and a race that only
      # shows up under Windows' scheduler is exactly the kind of thing this job
      # exists to catch.
      - name: Run tests
        run: go test -v -race ./...

  integration:
    name: Integration (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ktunnel-itest

      # These tests need a real kubelet. They assert that the pod starts
      # without restarting -- meaning it can read the credentials ktunnel
      # generated for it -- and that traffic actually crosses the tunnel.
      # A fake client sees none of that, which is how v2.4.0 shipped a
      # crash loop past a fully green unit suite.
      - name: Build binary and image
        run: |
          go build -o ktunnel .
          docker build -t ktunnel:itest .
          kind load docker-image ktunnel:itest --name ktunnel-itest

      - name: Run integration tests
        env:
          KTUNNEL_BIN: ${{ github.workspace }}/ktunnel
          KTUNNEL_IMAGE: ktunnel:itest
          KTUNNEL_TEST_CONTEXT: kind-ktunnel-itest
        run: go test -tags integration -v -timeout 20m -count=1 ./test/integration/...
